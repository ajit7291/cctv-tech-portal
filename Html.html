<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechHire Kerala - CCTV Technician Portal</title>
<!-- Tailwind CSS for modern responsive styling -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Web App Manifest for PWA Capabilities -->
<link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlRlY2hIaXJlIEtlcmFsYSIsCiAgInNob3J0X25hbWUiOiAiVGVjaEhpcmUiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2Y4ZmFmYyIsCiAgInRoZW1lX2NvbG9yIjogIiMxZDQwOGUiCn0=">
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-12">

<!-- Header / Navigation Bar -->
<header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
<div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center space-x-2">
<i class="fa-solid me-1 fa-video text-xl text-amber-400"></i>
<h1 class="text-lg font-bold tracking-tight">TechHire <span class="text-amber-400">Kerala</span></h1>
</div>
<div class="flex items-center space-x-2">
<button onclick="toggleAdminModal()" class="text-xs bg-indigo-800 hover:bg-indigo-700 text-white border border-indigo-600 px-3 py-1.5 rounded-lg flex items-center gap-1 shadow-sm transition">
<i class="fa-solid fa-gear text-amber-400"></i> Settings
</button>
</div>
</div>
</header>

<!-- Tab Switching Navigation -->
<div class="max-w-md mx-auto bg-white border-b border-slate-200 sticky top-[52px] z-40 shadow-sm">
<div class="flex">
<button id="tab-apply-btn" onclick="switchTab('apply')" class="flex-1 py-3 text-center font-medium text-indigo-900 border-b-2 border-indigo-900 flex items-center justify-center gap-2">
<i class="fa-solid fa-user-plus"></i> Candidate Form
</button>
<button id="tab-admin-btn" onclick="switchTab('admin')" class="flex-1 py-3 text-center font-medium text-slate-500 border-b-2 border-transparent hover:text-indigo-900 flex items-center justify-center gap-2">
<i class="fa-solid fa-list-check"></i> Candidate Directory
</button>
</div>
</div>

<!-- MAIN CONTAINER -->
<main class="max-w-md mx-auto p-4">

<!-- CANDIDATE APPLICATION FORM TAB -->
<section id="section-apply" class="space-y-4">
<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900 flex items-start gap-2">
<i class="fa-solid fa-circle-info text-amber-600 mt-0.5 text-sm"></i>
<div>
<strong>Direct Company Hiring (Kerala)</strong><br>
Register below to directly forward your profile & resume to our company WhatsApp channel.
</div>
</div>

<form id="techForm" onsubmit="handleFormSubmit(event)" class="bg-white border border-slate-200 shadow-sm rounded-xl p-4 space-y-4">

<!-- Full Name -->
<div>
<label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Full Name *</label>
<input type="text" id="fullName" required placeholder="e.g. Rahul V." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
</div>

<!-- Mobile Number -->
<div>
<label class="block text-xs font-semibold text-slate-700 uppercase mb-1">WhatsApp Mobile Number *</label>
<input type="tel" id="mobileNo" required placeholder="10-digit mobile number" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
</div>

<!-- District Dropdown (Kerala Specific) -->
<div>
<label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Kerala District *</label>
<select id="district" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
<option value="">Select District</option>
<option value="Ernakulam">Ernakulam (Kochi / Kakkanad)</option>
<option value="Kozhikode">Kozhikode</option>
<option value="Thiruvananthapuram">Thiruvananthapuram</option>
<option value="Thrissur">Thrissur</option>
<option value="Malappuram">Malappuram</option>
<option value="Kollam">Kollam</option>
<option value="Kannur">Kannur</option>
<option value="Kottayam">Kottayam</option>
<option value="Alappuzha">Alappuzha</option>
<option value="Palakkad">Palakkad</option>
<option value="Idukki">Idukki</option>
<option value="Patanamthitta">Pathanamthitta</option>
<option value="Kasaragod">Kasaragod</option>
<option value="Wayanad">Wayanad</option>
</select>
</div>

<!-- Experience Level -->
<div>
<label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Experience Level *</label>
<select id="expLevel" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
<option value="Fresher (ITI/Polytechnic)">Fresher (ITI / Polytechnic Passout)</option>
<option value="Experienced (1-3 Years)">Experienced (1 to 3 Years)</option>
<option value="Senior Technician (3+ Years)">Senior Technician (3+ Years)</option>
<option value="Freelance Installer">Freelance Sub-contractor / Installer</option>
</select>
</div>

<!-- Technical Skills & Expertise -->
<div>
<label class="block text-xs font-semibold text-slate-700 uppercase mb-2">Practical Skills & Expertise</label>
<div class="grid grid-cols-2 gap-2 text-xs">
<label class="flex items-center gap-2 p-2 border rounded-lg hover:bg-slate-50 cursor-pointer">
<input type="checkbox" value="Analog/HD CCTV" class="skill-check accent-indigo-900">
<span>Analog / HD CCTV</span>
</label>
<label class="flex items-center gap-2 p-2 border rounded-lg hover:bg-slate-50 cursor-pointer">
<input type="checkbox" value="IP Cameras & NVR" class="skill-check accent-indigo-900">
<span>IP Camera & NVR</span>
</label>
<label class="flex items-center gap-2 p-2 border rounded-lg hover:bg-slate-50 cursor-pointer">
<input type="checkbox" value="Biometrics & Access" class="skill-check accent-indigo-900">
<span>Biometrics / Access</span>
</label>
<label class="flex items-center gap-2 p-2 border rounded-lg hover:bg-slate-50 cursor-pointer">
<input type="checkbox" value="Fiber Splicing" class="skill-check accent-indigo-900">
<span>Fiber Splicing / FTTH</span>
</label>
<label class="flex items-center
